[pytest]
DJANGO_SETTINGS_MODULE = bcm_backend.settings.test
python_files = test_*.py
testpaths = apps
addopts =
    --strict-markers
    # The backend root carries an __init__.py, which would otherwise make pytest
    # import conftest.py as `bcm_backend.conftest` and shadow the settings package.
    --import-mode=importlib
    --disable-warnings
    -ra
    -m "not load"

# Building the test database runs every migration and takes several minutes.
# While iterating locally use:  pytest --reuse-db
# Drop the cached database after a migration change with: pytest --create-db
# It is deliberately NOT in addopts - CI must always build from scratch, or a
# broken migration would go unnoticed.

markers =
    slow: tests that take more than a second
    integration: tests that cross app boundaries
    load: wall-clock budgets needing a large dataset; excluded by default

